<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#0b0b0f;overflow:hidden}canvas{width:100vw;height:100vh}</style></head><body><canvas id="c"></canvas><script>
const c=document.querySelector('canvas'),x=c.getContext('2d');
const gold='#d6b36a',warm='#f5f1e8',muted='#9d927c';
let currentMedia=null,currentKind='';
window.loadMedia=async(kind,url)=>{currentMedia=null;currentKind=kind;if(!url)return;let el=document.createElement(kind==='video'?'video':'img');if(kind==='video'){el.muted=true;el.preload='auto'}await new Promise((resolve,reject)=>{let timer=setTimeout(()=>reject(new Error('素材加载超时')),15000);el.onload=el.onloadeddata=()=>{clearTimeout(timer);resolve()};el.onerror=()=>{clearTimeout(timer);reject(new Error('素材无法播放'))};el.src=url});currentMedia=el};
const clamp=n=>Math.max(0,Math.min(1,n));const ease=n=>1-Math.pow(1-clamp(n),3);
function text(s,px,py,size,color=warm,align='left',max=840){x.fillStyle=color;x.textAlign=align;x.font=`${size}px "Noto Serif CJK SC","Microsoft YaHei",sans-serif`;x.fillText(String(s||''),px,py,max)}
function dot(px,py,r,color=gold){x.fillStyle=color;x.shadowColor=gold;x.shadowBlur=16;x.beginPath();x.arc(px,py,r,0,Math.PI*2);x.fill();x.shadowBlur=0}
function captions(value){let lines=[];while(value){let part=value.slice(0,27);if(value.length>27){let cut=Math.max(...Array.from('，。！？；、').map(c=>part.lastIndexOf(c)));if(cut>13)part=value.slice(0,cut+1)}lines.push(part);value=value.slice(part.length)}return lines}
function draw(s,index,total,t,duration,beats,strongBeats,w,h){
 c.width=w;c.height=h;x.setTransform(w/960,0,0,h/540,0,0);
 let bg=x.createRadialGradient(540,260,15,480,250,700);bg.addColorStop(0,'#242015');bg.addColorStop(.62,'#101010');bg.addColorStop(1,'#08090b');x.fillStyle=bg;x.fillRect(0,0,960,540);
 if(currentMedia){let sw=currentMedia.videoWidth||currentMedia.naturalWidth,sh=currentMedia.videoHeight||currentMedia.naturalHeight;if(sw&&sh){let scale=Math.max(960/sw,540/sh),dw=sw*scale,dh=sh*scale;x.globalAlpha=.30;x.drawImage(currentMedia,(960-dw)/2,(540-dh)/2,dw,dh);x.globalAlpha=1;x.fillStyle='rgba(5,7,12,.35)';x.fillRect(0,0,960,540)}}
 for(let i=0;i<85;i++){let px=(i*173+37)%960,py=(i*97+73)%480;x.fillStyle=`rgba(214,179,106,${.08+.1*Math.sin(i*3+t*.3)**2})`;x.fillRect(px,py,1.5,1.5)}
 text(String(index+1).padStart(2,'0')+'  /  '+String(total).padStart(2,'0')+'     V I B E L A B',48,34,12,muted);x.strokeStyle='#5f543d';x.beginPath();x.moveTo(48,52);x.lineTo(912,52);x.stroke();text(s.heading,48,102,30,warm,'left',850);
 let spec=s.spec||{}, params=spec.parameters||{}, animation=spec.animation||{},layout=spec.layout||{},type=s.visual;let count=params.count?Math.max(2,Math.min(60,params.count)):8;
 let beatBound=animation.beat_binding!==false,clock=t;
 if(beatBound&&beats.length>1){let passed=beats.filter(b=>b<=t);let last=passed.length?passed[passed.length-1]:0;if(t-last<1.2)clock=last}
 let frames=animation.keyframes||[0,.65],raw=clamp((clock/duration-frames[0])/Math.max(.01,frames[1]-frames[0]));let p=animation.motion==='linear'?raw:animation.motion==='step'?Math.floor(raw*4)/4:ease(raw);let pulse=beatBound&&strongBeats.some(b=>t>=b&&t-b<.18)?1.24:beatBound&&beats.some(b=>t>=b&&t-b<.18)?1.12:1;
 if(type==='dots'||type==='network'){
  let pts=[];for(let i=0;i<count;i++){let a=i*Math.PI*2/count-Math.PI/2,r=110+(i%3)*10;pts.push([(layout.graphic_x||650)+Math.cos(a)*r,(layout.graphic_y||255)+Math.sin(a)*r])}
  let visible=Math.max(1,Math.ceil(p*count));
  let shown=0;if(type==='network'){let lines=[];for(let i=0;i<count;i++)for(let j=i+1;j<count;j++)lines.push([i,j]);shown=Math.floor(p*lines.length);x.strokeStyle='rgba(214,179,106,.13)';x.lineWidth=1;for(let k=0;k<shown;k++){let [a,b]=lines[k];x.beginPath();x.moveTo(...pts[a]);x.lineTo(...pts[b]);x.stroke()}visible=count}
  pts.slice(0,visible).forEach(([a,b])=>dot(a,b,3*pulse));text(s.key,95,240,60,gold,'left',380);text(s.detail,95,282,19,muted,'left',395);if(type==='network'&&params.count)text(`连线 ${shown} / ${count*(count-1)/2}`,95,320,18,gold);if(!params.count)text('粒子数量为示意',650,410,15,muted,'center');
 }else if(type==='compare'){
  const value=params.value,secondary=params.secondary_value;
  text(s.key,100,220,67,gold);if(value!==null&&value!==undefined){let totalWidth=730;x.fillStyle='#353024';x.fillRect(110,288,totalWidth,22);x.fillStyle=gold;x.fillRect(110,288,totalWidth*value/100*p,22);text((params.labels||[])[0]||'',110,347,18,muted);text((params.labels||[])[1]||'',840,347,18,muted,'right');if(secondary!==null&&secondary!==undefined)text(Math.abs(value+secondary-100)<.15?`1 − ${secondary}% = ${value}%`:`${secondary}%   /   ${value}%`,840,260,26,warm,'right')}else text('请填写比例数值',110,310,20,muted);
 }else if(type==='formula'){
  let parts=String(params.formula||s.detail||'').split(/([×=])/).filter(Boolean);let n=Math.max(1,Math.ceil(parts.length*p));text(parts.slice(0,n).join(' '),100,225,33,warm,'left',760);x.fillStyle=gold;x.fillRect(100,265,720*p,2);text(s.key,100,340,58,gold,'left',700);
 }else if(type==='bars'||type==='curve'){
  let values=spec.elements||[];let negative=values.some(v=>v.value<0);if(negative)values=[];let max=Math.max(1,...values.map(v=>v.value||0));x.strokeStyle='#746447';x.beginPath();x.moveTo(170,350);x.lineTo(820,350);x.stroke();let coords=[];values.forEach((v,i)=>{let px=220+i*(540/Math.max(1,values.length-1)),py=340-(v.value||0)/max*160*p;coords.push([px,py]);if(type==='bars'){x.fillStyle='#c5a369';x.fillRect(px-20,py,40,350-py)}text(v.label,px,380,15,muted,'center')});if(type==='curve'){x.strokeStyle=gold;x.lineWidth=3;x.beginPath();coords.forEach(([a,b],i)=>i?x.lineTo(a,b):x.moveTo(a,b));x.stroke();coords.forEach(([a,b])=>dot(a,b,4))}if(!values.length)text(negative?'暂不支持负值图表':'没有可绘制的数据',480,260,20,muted,'center');text(s.key,95,180,42,gold);
 }else if(type==='scattering'){
  let cx=580,cy=260;dot(cx,cy,11,'#dce9ff');text('大气分子',cx,cy+38,15,muted,'center');x.lineWidth=3;x.strokeStyle='#f2dfb0';x.beginPath();x.moveTo(140,cy);x.lineTo(140+Math.min(440,440*p*2),cy);x.stroke();
  if(p>.35){let q=clamp((p-.35)/.65);for(let j=0;j<9;j++){let a=(j-4)*.48;x.strokeStyle=j%3===0?'#d79b78':'#78b8ff';x.globalAlpha=.35+.5*q;x.beginPath();x.moveTo(cx,cy);x.lineTo(cx+Math.cos(a)*155*q,cy+Math.sin(a)*155*q);x.stroke()}x.globalAlpha=1}text(s.key,145,195,38,gold,'left',330);text(s.detail,145,350,18,muted,'left',650);text('光线与散射方向为示意',800,400,13,muted,'right');
 }else if(type==='geometry'){
  let sides=Math.max(3,Math.min(8,params.sides||3)),cx=layout.graphic_x||650,cy=layout.graphic_y||255,r=110;let points=[];for(let i=0;i<sides;i++){let a=-Math.PI/2+i*2*Math.PI/sides;points.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r])}x.strokeStyle=gold;x.lineWidth=3;x.beginPath();points.forEach(([a,b],i)=>i?x.lineTo(a,b):x.moveTo(a,b));x.closePath();x.globalAlpha=.1+.9*p;x.stroke();x.fillStyle='rgba(214,179,106,.10)';x.fill();x.globalAlpha=1;points.slice(0,Math.ceil(sides*p)).forEach(([a,b])=>dot(a,b,4*pulse));text(s.key,95,240,52,gold,'left',380);text(s.detail,95,295,19,muted,'left',390);
 }else if(type==='flow'||type==='timeline'){
  let labels=(params.labels||[]).length?params.labels:['01','02','03'];labels=labels.slice(0,5);let left=170,right=790,y=260;x.strokeStyle='#8e784d';x.lineWidth=2;x.beginPath();x.moveTo(left,y);x.lineTo(left+(right-left)*p,y);x.stroke();labels.forEach((l,i)=>{let px=left+(right-left)*i/Math.max(1,labels.length-1);if(p>=i/Math.max(1,labels.length-1)){dot(px,y,7*pulse);text(l,px,310,17,warm,'center',130)}});text(s.key,480,190,47,gold,'center',750);text(s.detail,480,367,19,muted,'center',800);
 }else {let candidates=params.candidates||[];let shown=type==='question'&&candidates.length?candidates[Math.min(candidates.length-1,Math.floor(p*candidates.length))]:s.key;text(shown,480,270,76*pulse,gold,'center',800);x.strokeStyle='#806d48';x.beginPath();x.moveTo(330,308);x.lineTo(630,308);x.stroke();text(s.detail,480,350,19,muted,'center',800)}
 let chunks=captions(s.narration||''),speechDuration=spec.timing?.speech_duration||duration;text(chunks[Math.min(chunks.length-1,Math.floor(t/speechDuration*chunks.length))],480,470,21,warm,'center',860);
 x.fillStyle='#d6b36a';x.fillRect(48,510,864*((index+clamp(t/duration))/total),2);
 if(spec.transition==='fade'){let opacity=Math.max(0,1-Math.min(t/.35,(duration-t)/.35,1));x.fillStyle=`rgba(0,0,0,${opacity})`;x.fillRect(0,0,960,540)}
}
window.renderFrame=async(...args)=>{if(currentMedia&&currentKind==='video'&&Number.isFinite(currentMedia.duration)&&currentMedia.duration>0){let desired=(args[3]%Math.max(.1,currentMedia.duration-.05));if(Math.abs(currentMedia.currentTime-desired)>.015){await new Promise((resolve,reject)=>{let timer=setTimeout(()=>reject(new Error('视频素材定位超时')),10000);currentMedia.onseeked=()=>{clearTimeout(timer);resolve()};currentMedia.currentTime=desired})}}draw(...args)};
</script></body></html>
